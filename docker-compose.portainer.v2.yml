services:
  wall-dashboard-v2:
    image: node:22-alpine
    container_name: homeassistant-wall-dashboard-v2
    working_dir: /workspace/app
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache git
        if [ ! -d .git ]; then
          git clone --depth 1 --branch "$${GIT_SYNC_BRANCH}" "$${GIT_SYNC_REPO}" .
        else
          git fetch --depth 1 origin "$${GIT_SYNC_BRANCH}"
          git reset --hard FETCH_HEAD
        fi
        npm ci
        npm run build
        exec npm run start
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3200}:3000"
    environment:
      TZ: Europe/Oslo
      HA_URL: ${HA_URL}
      HA_TOKEN: ${HA_TOKEN}
      HA_HOME_MODE_ENTITY_ID: ${HA_HOME_MODE_ENTITY_ID:-input_select.home_mode}
      HA_GUEST_MODE_ENTITY_ID: ${HA_GUEST_MODE_ENTITY_ID:-input_boolean.gjest}
      HA_GUEST_VOUCHER_SENSOR_ID: ${HA_GUEST_VOUCHER_SENSOR_ID:-sensor.67647a4bca314858fac0f8fc_voucher}
      HA_FAMILY_GROUP_ENTITY_ID: ${HA_FAMILY_GROUP_ENTITY_ID:-group.family}
      HA_GUEST_VOUCHER_CREATE_BUTTON_ID: ${HA_GUEST_VOUCHER_CREATE_BUTTON_ID:-button.67647a4bca314858fac0f8fc_create}
      HA_SECURITY_MODE_ENTITY_ID: ${HA_SECURITY_MODE_ENTITY_ID:-input_number.toggle_security_mode}
      HA_FRONT_DOOR_LOCK_ENTITY_ID: ${HA_FRONT_DOOR_LOCK_ENTITY_ID:-lock.aqara_smart_lock_u200_2}
      HA_WEATHER_HOURLY_ENTITY_ID: ${HA_WEATHER_HOURLY_ENTITY_ID:-sensor.weather_hourly}
      HA_WEATHER_DAILY_ENTITY_ID: ${HA_WEATHER_DAILY_ENTITY_ID:-sensor.weather_daily}
      HA_DOORBELL_CAMERA_ENTITY_ID: ${HA_DOORBELL_CAMERA_ENTITY_ID:-camera.ringeklokke_fluent}
      HA_COURTYARD_CAMERA_ENTITY_ID: ${HA_COURTYARD_CAMERA_ENTITY_ID:-camera.gaardsplass_fluent_lens_0}
      HA_METEOALARM_ENTITY_ID: ${HA_METEOALARM_ENTITY_ID:-}
      HA_LIGHTNING_DISTANCE_ENTITY_ID: ${HA_LIGHTNING_DISTANCE_ENTITY_ID:-}
      HA_AURORA_VISIBILITY_ENTITY_ID: ${HA_AURORA_VISIBILITY_ENTITY_ID:-}
      HA_ENERGY_TODAY_ENTITY_ID: ${HA_ENERGY_TODAY_ENTITY_ID:-}
      HA_ENERGY_HOURLY_CONSUMPTION_ENTITY_ID: ${HA_ENERGY_HOURLY_CONSUMPTION_ENTITY_ID:-}
      HA_ENERGY_POWER_ENTITY_ID: ${HA_ENERGY_POWER_ENTITY_ID:-}
      HA_ENERGY_PRICE_ENTITY_ID: ${HA_ENERGY_PRICE_ENTITY_ID:-}
      HA_ROOM_LIVING_ENTITY_ID: ${HA_ROOM_LIVING_ENTITY_ID:-}
      HA_ROOM_BEDROOM_ENTITY_ID: ${HA_ROOM_BEDROOM_ENTITY_ID:-}
      HA_ROOM_BATHROOM_ENTITY_ID: ${HA_ROOM_BATHROOM_ENTITY_ID:-}
      HA_ROOM_LIVING_HUMIDITY_ENTITY_ID: ${HA_ROOM_LIVING_HUMIDITY_ENTITY_ID:-}
      HA_ROOM_LIVING_CO2_ENTITY_ID: ${HA_ROOM_LIVING_CO2_ENTITY_ID:-}
      HA_ROOM_BEDROOM_HUMIDITY_ENTITY_ID: ${HA_ROOM_BEDROOM_HUMIDITY_ENTITY_ID:-}
      HA_ROOM_BEDROOM_CO2_ENTITY_ID: ${HA_ROOM_BEDROOM_CO2_ENTITY_ID:-}
      HA_ROOM_BATHROOM_HUMIDITY_ENTITY_ID: ${HA_ROOM_BATHROOM_HUMIDITY_ENTITY_ID:-}
      HA_ROOM_BATHROOM_CO2_ENTITY_ID: ${HA_ROOM_BATHROOM_CO2_ENTITY_ID:-}
      HA_ROOM_FIRST_FLOOR_BATHROOM_ENTITY_ID: ${HA_ROOM_FIRST_FLOOR_BATHROOM_ENTITY_ID:-}
      HA_ROOM_FIRST_FLOOR_BATHROOM_HUMIDITY_ENTITY_ID: ${HA_ROOM_FIRST_FLOOR_BATHROOM_HUMIDITY_ENTITY_ID:-}
      HA_ROOM_CLIMATE_ADVICE_ENTITY_ID: ${HA_ROOM_CLIMATE_ADVICE_ENTITY_ID:-}
      HA_WASTE_ENTITY_ID: ${HA_WASTE_ENTITY_ID:-sensor.next_garbage_collection}
      HA_CAR_ANDREAS_RANGE_ENTITY_ID: ${HA_CAR_ANDREAS_RANGE_ENTITY_ID:-}
      HA_CAR_ANDREAS_BATTERY_ENTITY_ID: ${HA_CAR_ANDREAS_BATTERY_ENTITY_ID:-}
      HA_CAR_HEGE_RANGE_ENTITY_ID: ${HA_CAR_HEGE_RANGE_ENTITY_ID:-}
      HA_CAR_HEGE_BATTERY_ENTITY_ID: ${HA_CAR_HEGE_BATTERY_ENTITY_ID:-}
      HA_ANDREAS_TRAVEL_TIME_ENTITY_ID: ${HA_ANDREAS_TRAVEL_TIME_ENTITY_ID:-}
      HA_HEGE_TRAVEL_TIME_ENTITY_ID: ${HA_HEGE_TRAVEL_TIME_ENTITY_ID:-}
      HA_CALENDAR_ENTITY_ID: ${HA_CALENDAR_ENTITY_ID:-calendar.outlook_andreas_felles}
      HA_JACOB_WEEKLY_PLAN_ENTITY_ID: ${HA_JACOB_WEEKLY_PLAN_ENTITY_ID:-}
      HA_REPAIR_HEALTH_ENTITY_ID: ${HA_REPAIR_HEALTH_ENTITY_ID:-}
      AI_REPORT_SECRET: ${AI_REPORT_SECRET:-}
      N8N_AI_REPORT_REFRESH_URL: ${N8N_AI_REPORT_REFRESH_URL:-}
      AI_REPORT_STORE_PATH: ${AI_REPORT_STORE_PATH:-/workspace/app/.runtime/ai-report.json}
      GIT_SYNC_REPO: ${GIT_SYNC_REPO:-https://github.com/Nutti85/homeassistantwalldash.git}
      GIT_SYNC_BRANCH: ${GIT_SYNC_BRANCH:-codex/dashboard-prototype-v2}
      VITE_DASHBOARD_VERSION: v2
      PORT: "3000"
    volumes:
      - wall_dashboard_v2_code:/workspace/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  wall_dashboard_v2_code:
