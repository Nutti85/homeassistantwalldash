services:
  wall-dashboard:
    build: .
    container_name: homeassistant-wall-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      TZ: Europe/Oslo
      HA_URL: ${HA_URL}
      HA_TOKEN: ${HA_TOKEN}
      HA_HOME_MODE_ENTITY_ID: ${HA_HOME_MODE_ENTITY_ID:-input_select.home_mode}
      HA_GUEST_MODE_ENTITY_ID: ${HA_GUEST_MODE_ENTITY_ID:-input_boolean.gjest}
      HA_GUEST_VOUCHER_SENSOR_ID: ${HA_GUEST_VOUCHER_SENSOR_ID:-sensor.67647a4bca314858fac0f8fc_voucher}
      HA_FAMILY_GROUP_ENTITY_ID: ${HA_FAMILY_GROUP_ENTITY_ID:-group.family}
      HA_GUEST_VOUCHER_CREATE_BUTTON_ID: ${HA_GUEST_VOUCHER_CREATE_BUTTON_ID:-button.67647a4bca314858fac0f8fc_create}
      HA_DOORBELL_CAMERA_ENTITY_ID: ${HA_DOORBELL_CAMERA_ENTITY_ID:-camera.ringeklokke_fluent}
      HA_COURTYARD_CAMERA_ENTITY_ID: ${HA_COURTYARD_CAMERA_ENTITY_ID:-camera.gaardsplass_fluent_lens_0}
      AI_REPORT_SECRET: ${AI_REPORT_SECRET:-}
      N8N_AI_REPORT_REFRESH_URL: ${N8N_AI_REPORT_REFRESH_URL:-}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
