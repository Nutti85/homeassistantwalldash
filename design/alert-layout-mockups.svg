<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1330" viewBox="0 0 1800 1330">
  <defs>
    <linearGradient id="camera" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74817d"/><stop offset="1" stop-color="#27332f"/></linearGradient>
    <style>
      .board{fill:#edf1ee}.title{font:700 31px Arial,sans-serif;fill:#182420}.subtitle{font:400 17px Arial,sans-serif;fill:#52615b}.panel{fill:#0d1c17;stroke:#31453d;stroke-width:2}.card{fill:#14251f;stroke:#31453d;stroke-width:1.5}.muted{font:400 13px Arial,sans-serif;fill:#a9b7b0}.small{font:600 14px Arial,sans-serif;fill:#d7e2dc}.body{font:600 18px Arial,sans-serif;fill:#eff7f1}.heading{font:700 18px Arial,sans-serif;fill:#eff7f1}.time{font:700 29px Arial,sans-serif;fill:#f6fbf7}.label{font:700 13px Arial,sans-serif;fill:#b9c9c0;letter-spacing:1px}.pill{font:700 12px Arial,sans-serif;fill:#f6c28e}.orange{fill:#ea9255}.alert{fill:#3b211c;stroke:#a84e38;stroke-width:1.5}.note{fill:#fffdf8;stroke:#cbd4cf;stroke-width:1.5}.noteT{font:600 15px Arial,sans-serif;fill:#26342e}.call{fill:#f3a35d}.callT{font:700 13px Arial,sans-serif;fill:#2b1a0f}.line{stroke:#40534b;stroke-width:1}.camera{fill:url(#camera)}
    </style>
  </defs>
  <rect class="board" width="1800" height="1330"/>
  <text x="70" y="70" class="title">Alert-layout directions</text>
  <text x="70" y="102" class="subtitle">Three compact alternatives for the Walldash home screen · Clock and date stay in their original top-right anchor</text>

  <!-- A -->
  <g transform="translate(70 160)">
    <text x="0" y="-22" class="title" font-size="24">A · Persistent status strip</text>
    <rect class="panel" width="790" height="560" rx="18"/>
    <text x="30" y="44" class="label">SMARTHJEM</text><text x="615" y="47" class="time">21:45</text><text x="697" y="45" class="muted">Onsdag 16. september</text>
    <rect class="alert" x="24" y="64" width="742" height="48" rx="10"/><circle class="orange" cx="48" cy="88" r="7"/><text x="66" y="84" class="body" font-size="15">Ytterdøren er ulåst</text><text x="66" y="102" class="muted" font-size="12">Sist endret for 8 minutter siden</text><text x="730" y="93" class="small">›</text>
    <text x="30" y="148" class="label">SIDEN SIST</text><rect class="card" x="24" y="164" width="210" height="238" rx="14"/><text x="46" y="202" class="heading">Beskjeder</text><text x="46" y="230" class="muted">24 uleste</text><line class="line" x1="46" y1="248" x2="212" y2="248"/><text x="46" y="277" class="small">Nicolai</text><text x="46" y="303" class="body" font-size="14">Tur til skateparken …</text><line class="line" x1="46" y1="322" x2="212" y2="322"/><text x="46" y="349" class="body" font-size="14">Naturbingo i dag …</text>
    <text x="260" y="148" class="label">AKKURAT NÅ</text><rect class="camera" x="254" y="164" width="226" height="128" rx="14"/><rect x="268" y="180" width="47" height="23" rx="5" fill="#e6675f"/><text x="275" y="197" class="small">LIVE</text><text x="267" y="320" class="heading">Ringeklokke</text><rect class="camera" x="500" y="164" width="226" height="128" rx="14"/><rect x="514" y="180" width="47" height="23" rx="5" fill="#e6675f"/><text x="521" y="197" class="small">LIVE</text><text x="513" y="320" class="heading">Gårdsplassen</text>
    <rect class="card" x="254" y="344" width="472" height="142" rx="14"/><text x="278" y="380" class="time">14,3°C</text><text x="278" y="404" class="muted">Delvis skyet</text><path d="M278 448 C330 420 370 464 420 436 S520 458 570 423 S650 455 700 430" fill="none" stroke="#d99c55" stroke-width="3"/>
    <rect class="card" x="24" y="424" width="210" height="106" rx="14"/><text x="46" y="459" class="heading">Hendelser</text><text x="46" y="488" class="small">Person · Hage</text><text x="46" y="510" class="muted">19:24</text>
    <text x="26" y="552" class="muted">Alert is always visible but costs only one compact row.</text>
  </g>
  <g transform="translate(70 748)"><rect class="note" width="790" height="88" rx="12"/><circle class="call" cx="28" cy="29" r="15"/><text x="23" y="34" class="callT">A</text><text x="55" y="31" class="noteT">Best for a single live safety state</text><text x="55" y="57" class="subtitle">A slim strip keeps the alert noticeable without turning it into a header. Tap opens details.</text></g>

  <!-- B -->
  <g transform="translate(940 160)">
    <text x="0" y="-22" class="title" font-size="24">B · Priority card in the content rail</text>
    <rect class="panel" width="790" height="560" rx="18"/>
    <text x="30" y="44" class="label">SMARTHJEM</text><text x="615" y="47" class="time">21:45</text><text x="697" y="45" class="muted">Onsdag 16. september</text>
    <text x="30" y="90" class="label">SIDEN SIST</text><rect class="card" x="24" y="106" width="210" height="290" rx="14"/><text x="46" y="144" class="heading">Beskjeder</text><text x="46" y="172" class="muted">24 uleste</text><line class="line" x1="46" y1="190" x2="212" y2="190"/><text x="46" y="220" class="body" font-size="14">Tur til skateparken …</text><text x="46" y="263" class="body" font-size="14">Naturbingo i dag …</text><line class="line" x1="46" y1="288" x2="212" y2="288"/><text x="46" y="325" class="heading">Hendelser</text><text x="46" y="353" class="small">Person · Hage</text>
    <text x="260" y="90" class="label">AKKURAT NÅ</text><rect class="camera" x="254" y="106" width="226" height="128" rx="14"/><rect x="268" y="121" width="47" height="23" rx="5" fill="#e6675f"/><text x="275" y="138" class="small">LIVE</text><text x="267" y="262" class="heading">Ringeklokke</text><rect class="camera" x="500" y="106" width="226" height="128" rx="14"/><rect x="514" y="121" width="47" height="23" rx="5" fill="#e6675f"/><text x="521" y="138" class="small">LIVE</text><text x="513" y="262" class="heading">Gårdsplassen</text>
    <rect class="card" x="254" y="286" width="472" height="184" rx="14"/><text x="278" y="326" class="time">14,3°C</text><text x="278" y="351" class="muted">Delvis skyet</text><path d="M278 430 C330 400 370 448 420 414 S520 438 570 406 S650 440 700 412" fill="none" stroke="#d99c55" stroke-width="3"/>
    <text x="30" y="432" class="label">VIKTIG NÅ</text><rect class="alert" x="24" y="448" width="210" height="82" rx="14"/><circle class="orange" cx="48" cy="474" r="7"/><text x="65" y="478" class="body" font-size="15">Ytterdøren er ulåst</text><text x="48" y="506" class="muted" font-size="12">8 minutter · trykk for å se</text>
    <text x="26" y="552" class="muted">The alert enters the same scanning rhythm as messages and events.</text>
  </g>
  <g transform="translate(940 748)"><rect class="note" width="790" height="88" rx="12"/><circle class="call" cx="28" cy="29" r="15"/><text x="23" y="34" class="callT">B</text><text x="55" y="31" class="noteT">Best for a calm dashboard with low alert volume</text><text x="55" y="57" class="subtitle">Clock remains untouched; “Viktig nå” becomes a purposeful, fixed-size content card.</text></g>

  <!-- C -->
  <g transform="translate(70 960)">
    <text x="0" y="-22" class="title" font-size="24">C · Floating safety chip</text>
    <rect class="panel" width="790" height="280" rx="18"/>
    <text x="30" y="44" class="label">SMARTHJEM</text><text x="615" y="47" class="time">21:45</text><text x="697" y="45" class="muted">Onsdag 16. september</text>
    <text x="30" y="90" class="label">SIDEN SIST</text><rect class="card" x="24" y="106" width="210" height="132" rx="14"/><text x="46" y="142" class="heading">Beskjeder</text><text x="46" y="170" class="muted">24 uleste</text><text x="46" y="205" class="body" font-size="14">Tur til skateparken …</text>
    <text x="260" y="90" class="label">AKKURAT NÅ</text><rect class="camera" x="254" y="106" width="226" height="128" rx="14"/><rect x="268" y="121" width="47" height="23" rx="5" fill="#e6675f"/><text x="275" y="138" class="small">LIVE</text><rect class="camera" x="500" y="106" width="226" height="128" rx="14"/><rect x="514" y="121" width="47" height="23" rx="5" fill="#e6675f"/><text x="521" y="138" class="small">LIVE</text>
    <rect class="alert" x="517" y="184" width="240" height="58" rx="29"/><circle class="orange" cx="541" cy="213" r="7"/><text x="558" y="208" class="body" font-size="14">Ytterdøren er ulåst</text><text x="558" y="226" class="muted" font-size="11">8 minutter siden</text>
  </g>
  <g transform="translate(940 960)"><rect class="note" width="790" height="132" rx="12"/><circle class="call" cx="28" cy="29" r="15"/><text x="23" y="34" class="callT">C</text><text x="55" y="31" class="noteT">Best for glanceable, interrupt-light monitoring</text><text x="55" y="57" class="subtitle">A floating chip overlays only the active area and disappears when resolved.</text><text x="55" y="86" class="subtitle">Escalate it to a full alert only for a door left open beyond a chosen threshold.</text></g>
</svg>
