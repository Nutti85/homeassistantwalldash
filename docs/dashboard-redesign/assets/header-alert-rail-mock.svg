<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10231d"/><stop offset="1" stop-color="#08120f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b3029"/><stop offset="1" stop-color="#11211c"/></linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a251d"/><stop offset="1" stop-color="#241918"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="50" y="34" width="1500" height="142" rx="22" fill="#10221c" stroke="#2a4037"/>
  <line x1="78" y1="176" x2="1522" y2="176" stroke="#2b4038"/>

  <!-- Header: day moves beside the product identity -->
  <g transform="translate(82 66)">
    <rect width="50" height="50" rx="16" fill="#ffe0a8"/>
    <text x="25" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#372515">✦</text>
    <text x="66" y="17" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#aabbb3">KLARA AI</text>
    <text x="66" y="39" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f5ef">Hjemmeoversikt</text>
    <circle cx="70" cy="73" r="4" fill="#78d9aa"/>
    <text x="81" y="77" font-family="Arial, sans-serif" font-size="13" fill="#b7c8c0">Tirsdag · Arbeidsdag</text>
  </g>

  <!-- Clock remains visually central -->
  <g transform="translate(780 66)">
    <text x="0" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#fbfaf3">19:52</text>
    <text x="0" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#abbcb4">Tirsdag 8. september</text>
  </g>

  <!-- Proposed V1-inspired alert rail -->
  <g transform="translate(1018 52)" filter="url(#shadow)">
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#e7b39c">VIKTIG NÅ</text>
    <rect y="25" width="500" height="75" rx="13" fill="url(#alert)" stroke="#7e4d40"/>
    <rect x="12" y="37" width="51" height="51" rx="12" fill="#583027"/>
    <text x="37" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#ffb18f">♧</text>
    <text x="77" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff5ef">Ytterdøren er ulåst</text>
    <text x="77" y="76" font-family="Arial, sans-serif" font-size="12" fill="#dfb9a9">Sist endret for 8 minutter siden</text>
    <rect x="389" y="45" width="94" height="35" rx="9" fill="#69392e"/>
    <text x="436" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff2ea">Lås døren  ›</text>
  </g>

  <!-- Existing dashboard content, intentionally muted -->
  <g opacity=".94">
    <text x="82" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#e2b18e">↶  DET SOM HAR SKJEDD</text>
    <text x="588" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#e2b18e">◉  AKKURAT NÅ</text>
    <text x="1096" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#e2b18e">→  DETTE SKJER</text>
    <rect x="80" y="242" width="440" height="485" rx="20" fill="url(#card)" stroke="#2c443a"/>
    <text x="108" y="277" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#b7c8c0">BREV OG OPPDATERINGER</text>
    <text x="108" y="307" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f7f7f0">Nye beskjeder</text>
    <g font-family="Arial, sans-serif" fill="#d9e0db"><text x="108" y="365" font-size="15">Jacob</text><text x="108" y="412" font-size="15">Tusen takk til foresatte som stilte opp …</text><text x="108" y="475" font-size="15">Nicolai</text><text x="108" y="522" font-size="15">OBS! Det er flere tilfeller av omgangs…</text></g>
    <g stroke="#2c443a"><line x1="108" y1="385" x2="490" y2="385"/><line x1="108" y1="545" x2="490" y2="545"/></g>
    <rect x="548" y="242" width="440" height="290" rx="20" fill="url(#card)" stroke="#2c443a"/>
    <text x="578" y="278" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#b7c8c0">KVELD · 19:00–23:00</text>
    <text x="578" y="309" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f7f7f0">Vær og forhold</text>
    <g transform="translate(575 330)"><g fill="#1b3029" stroke="#314a40"><rect width="88" height="164" rx="15"/><rect x="97" width="88" height="164" rx="15"/><rect x="194" width="88" height="164" rx="15"/><rect x="291" width="88" height="164" rx="15"/></g><g font-family="Arial, sans-serif" fill="#f2f4ee"><text x="18" y="36" font-size="23">☁</text><text x="17" y="74" font-size="13">Skyet</text><text x="113" y="36" font-size="22">16°</text><text x="112" y="74" font-size="13">Temperatur</text><text x="211" y="36" font-size="22">↝</text><text x="211" y="74" font-size="13">1 m/s</text><text x="307" y="36" font-size="22">☔</text><text x="307" y="74" font-size="13">0 mm</text></g></g>
    <rect x="548" y="550" width="440" height="177" rx="20" fill="url(#card)" stroke="#2c443a"/>
    <text x="578" y="588" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#b7c8c0">AVVIK FØRST</text><text x="578" y="619" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f7f7f0">Rom som trenger oppmerksomhet</text>
    <g font-family="Arial, sans-serif" font-size="14" fill="#d9e0db"><text x="578" y="655">Stue  ·  Temperatur 23,8°  ·  Fukt 51 %</text><text x="578" y="686">Soverom HA  ·  Temperatur 24,4°  ·  Fukt 54 %</text></g>
    <rect x="1016" y="242" width="504" height="135" rx="20" fill="url(#card)" stroke="#2c443a"/><text x="1046" y="276" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8ee2b2">AVREISEBRIEFING KLAR</text><text x="1046" y="309" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f7f7f0">Turntrening</text><text x="1046" y="337" font-family="Arial, sans-serif" font-size="15" fill="#b7c8c0">Dra ca. 20:12</text>
    <rect x="1016" y="396" width="504" height="140" rx="20" fill="url(#card)" stroke="#2c443a"/><text x="1046" y="439" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f7f7f0">Hendelser</text><text x="1046" y="474" font-family="Arial, sans-serif" font-size="15" fill="#b7c8c0">Ingenting planlagt i denne perioden.</text>
    <rect x="1016" y="555" width="504" height="172" rx="20" fill="#2b261d" stroke="#614a33"/><text x="1046" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#e2b18e">KLARA FORESLÅR</text><text x="1046" y="621" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f7f7f0">Forbered dette</text><text x="1046" y="659" font-family="Arial, sans-serif" font-size="15" fill="#e2ddd4">Gjør klart det dere trenger til «Sorte klær» i kveld.</text>
  </g>
  <rect x="50" y="770" width="1500" height="82" rx="20" fill="#13251f" stroke="#2a4037"/><g font-family="Arial, sans-serif" font-size="13" fill="#dce5df"><text x="130" y="818">◉  Lys</text><text x="290" y="818">❄  Klima</text><text x="470" y="818">♜  Støvsuger</text><text x="675" y="818">▣  Biler</text><text x="850" y="818">☼  Modus</text><text x="1030" y="818">✦  Klara</text><text x="1230" y="818">▣  Lås døren</text><text x="1400" y="818">◈  Overvåket</text></g>
  <rect x="1050" y="188" width="468" height="35" rx="17" fill="#21362d" opacity=".94"/><text x="1284" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#bfe8d0">DAGSTATUS FLYTTET TIL VENSTRE  ·  VARSLER FÅR EGEN PLASS</text>
</svg>
